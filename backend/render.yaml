services:
  - type: web
    name: skill-bridge-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: skill-bridge-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://skill-bridge-frontend.vercel.app"
      - key: ALLOW_CREDENTIALS
        value: "true"
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    
databases:
  - name: skill-bridge-db
    databaseName: skill_bridge
    user: default
    region: oregon
